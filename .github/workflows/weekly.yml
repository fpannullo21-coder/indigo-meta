name: Indigo Meta – report settimanale

on:
  schedule:
    - cron: "47 11 * * 1"  # ogni lunedì alle 11:47 UTC (12:47 in Italia d'inverno)
  workflow_dispatch:         # avvio manuale dal tab Actions
    inputs:
      week:
        description: "Settimana ISO (vuoto = ultima completa)"
        required: false
      publish:
        description: "Pubblica davvero su Instagram (altrimenti solo prova)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache classifiche Limitless
        uses: actions/cache@v4
        with:
          path: cache
          key: limitless-${{ github.run_id }}
          restore-keys: limitless-

      - name: Aggiorna l'elenco dei set (nuove espansioni)
        run: python tools/update_setmap.py || echo "Elenco set non aggiornato, uso quello salvato"

      - name: Genera report
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python run_weekly.py --week "${{ github.event.inputs.week }}"
          else
            python run_weekly.py
          fi

      - name: Prepara le immagini per Instagram
        id: site
        run: echo "dir=$(python prepare_site.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica le immagini su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pubblica su Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          ARGS="--dir _site/${{ steps.site.outputs.dir }} --base-url ${{ steps.deployment.outputs.page_url }}${{ steps.site.outputs.dir }}"
          if [ "$PUBLISH" = "true" ]; then python publish.py $ARGS; else python publish.py $ARGS --dry-run; fi

      - name: Salva slide e caption
        uses: actions/upload-artifact@v4
        with:
          name: indigo-meta-${{ github.run_number }}
          path: |
            output/*/slide_*.png
            output/*/caption.txt
            output/*/report.json
