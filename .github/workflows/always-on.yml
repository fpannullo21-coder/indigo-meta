name: Indigo Meta – pubblicatore sempre acceso

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tg-buttons                 # stessa coda dei pulsanti: mai due pubblicazioni insieme
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache/restore@v4
        with:
          path: cache/tg_state.json
          key: tg-${{ github.run_id }}
          restore-keys: tg-
      - name: Coda e pulsanti, ogni minuto per ~55 minuti
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python always_on.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/tg_state.json
          key: tg-${{ github.run_id }}
