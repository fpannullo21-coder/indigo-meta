name: Indigo Meta – major appena conclusi

on:                 # avviato all'orario giusto dal «pubblicatore sempre acceso» (always_on.py)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controllo veloce
        id: detect
        run: |
          pip install requests jinja2 pillow
          python run_watch.py --detect
      - name: Dipendenze complete
        if: steps.detect.outputs.todo != '0'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
      - name: Cache
        if: steps.detect.outputs.todo != '0'
        uses: actions/cache@v4
        with:
          path: cache
          key: limitless-${{ github.run_id }}
          restore-keys: limitless-
      - name: Prepara Top 8 e Campioni
        if: steps.detect.outputs.todo != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_watch.py --process
      - name: Conserva i post già in coda sul sito
        if: steps.detect.outputs.todo != '0'
        run: python keep_site.py
      - uses: actions/configure-pages@v5
        if: steps.detect.outputs.todo != '0'
      - uses: actions/upload-pages-artifact@v3
        if: steps.detect.outputs.todo != '0'
        with:
          path: _site
      - name: Pubblica le immagini su GitHub Pages
        id: deployment
        if: steps.detect.outputs.todo != '0'
        uses: actions/deploy-pages@v4
      - name: Salva coda ed elenco major
        if: steps.detect.outputs.todo != '0'
        run: |
          git config user.name "indigo-meta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json data/majors_ids.json
          git commit -m "Major concluso: Top 8 e Campioni in coda" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
